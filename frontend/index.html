<!DOCTYPE html>
<html>
  <head>
    <title>ki-pedia.</title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">

    <link id="app-favicon" rel="icon" type="image/png" href="/favicon.de.png">
    <script>
      (function () {
        var hostname = window.location.hostname.toLowerCase().replace(/^www\./, '');
        var iaPediaHosts = ['ia-pedia.ch', 'ia-pedia.org', 'wikiped-ia.ch', 'wikiped-ia.org'];
        var isIaPedia = iaPediaHosts.includes(hostname);
        var isAiPedia = hostname === 'ai-pedia.ch';
        var title = isIaPedia
          ? 'ia-pedia.'
          : isAiPedia
            ? 'ai-pedia.'
            : 'ki-pedia.';
        var favicon = isIaPedia
          ? '/favicon.fr.png'
          : isAiPedia
            ? '/favicon.en.png'
            : '/favicon.de.png';
        document.title = title;
        document.getElementById('app-favicon').href = favicon;
      })();
    </script>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
